name: Publicar

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Publicar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Fazer deploy
        uses: actions/deploy-pages@v4
